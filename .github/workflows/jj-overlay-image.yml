# Deployment-custom: publishes the vllm-jj source overlay image (FROM scratch).
# The full image is assembled on the GPU host with Dockerfile.apply, which pulls
# the multi-GB base anyway.
name: jj overlay image

on:
  push:
    branches:
      - "deploy/jj-cand*"
    paths:
      - "deploy/overlay-jj-*/**"
      - ".github/workflows/jj-overlay-image.yml"
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate to publish, e.g. cand6"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: jj-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve candidate
        id: cand
        env:
          INPUT: ${{ inputs.candidate }}
          REF: ${{ github.ref_name }}
        run: |
          cand="${INPUT:-${REF#deploy/jj-}}"
          if ! [[ "$cand" =~ ^cand[0-9]+$ ]]; then echo "bad candidate: $cand" >&2; exit 1; fi
          dir="deploy/overlay-jj-$cand"
          test -f "$dir/Dockerfile.overlay-image"
          echo "name=$cand" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Overlay files match the source tree
        env:
          DIR: ${{ steps.cand.outputs.dir }}
        run: |
          status=0
          while read -r f; do
            [ -z "$f" ] && continue
            if cmp -s "$f" "$DIR/overlay-root/$f"; then echo "same $f"; else echo "DRIFT $f"; status=1; fi
          done < "$DIR/overlay-files.txt"
          extra=$(cd "$DIR/overlay-root" && find . -type f | sed 's|^\./||' | sort | comm -23 - <(sort "../overlay-files.txt"))
          if [ -n "$extra" ]; then echo "unlisted overlay files: $extra"; status=1; fi
          exit $status

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cand.outputs.dir }}
          file: ${{ steps.cand.outputs.dir }}/Dockerfile.overlay-image
          platforms: linux/amd64
          provenance: false
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/lan-avelino/vllm-jj-overlay:jj-${{ steps.cand.outputs.name }}
            ghcr.io/lan-avelino/vllm-jj-overlay:jj-${{ steps.cand.outputs.name }}-${{ github.sha }}

      - name: Verify published platform
        env:
          IMAGE: ghcr.io/lan-avelino/vllm-jj-overlay:jj-${{ steps.cand.outputs.name }}-${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' | grep -Eq '"architecture": *"amd64"'
